name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create Dummy Secrets & Debug Keystore
        run: |
          # Create dummy .env for Secrets Gradle Plugin
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            echo "API_KEY=dummy_key" > .env
          fi
          
          # Generate Debug Keystore as expected by app/build.gradle.kts
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Obfuscated Release APK
        run: gradle assembleRelease --stacktrace

      - name: Upload Obfuscated Release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
